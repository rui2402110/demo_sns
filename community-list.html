<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kakko. ｜ 参加コミュニティ一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="community-list.css">
</head>
<body>

<div class="layout">

  <div id="slot-sidenav"></div>

  <div class="app">
    <header class="topbar hub-topbar" id="list-header">
      <p class="wordmark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8.6A6 6 0 1 1 7.4 2 4.8 4.8 0 0 0 14 8.6Z" stroke="#e07b2e" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        kakko.
      </p>
      <a class="breadcrumb" href="community.html">← コミュニティ</a>
      <p class="page-title">参加コミュニティ一覧</p>
      <p class="page-subtitle">参加中のコミュニティを確認できます。お気に入りにするとタイムラインに表示されます</p>
      <div class="filter-row">
        <div class="search-box">
          <svg class="search-box-icon" width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.2" stroke="currentColor" stroke-width="1.4"/><path d="m12 12 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input type="text" id="work-filter" class="search-box-input" placeholder="作品名で絞り込み" autocomplete="off">
          <button class="search-clear" id="work-filter-clear" type="button" aria-label="絞り込みをクリア" hidden><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="m2 2 6 6M8 2 2 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        </div>
        <button class="fav-filter" id="fav-filter" type="button" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 22 22" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M11 2 13.8 8.4 20.8 9 15.4 13.6 17 20.4 11 16.7 5 20.4 6.6 13.6 1.2 9 8.2 8.4 11 2Z"/></svg>お気に入り</button>
      </div>
    </header>

    <main class="feed" id="list-view">
      <section class="community-list" id="community-list"></section>
      <div class="detail-empty" id="list-empty" hidden></div>
    </main>
  </div>

</div>


<div id="slot-toast"></div>

<script src="components-bundle.js"></script>
<script src="loader.js"></script>
<script src="community-common.js"></script>
<script src="community-list.js"></script>
<script>
  initCommunityList();
  KakkoLoader.load('component-sidenav.frag', '#slot-sidenav').then(function () { KakkoLoader.markActiveNav('community'); });
  KakkoLoader.load('component-toast.frag', '#slot-toast');
</script>

</body>
</html>
