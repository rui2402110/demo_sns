<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kakko. ｜ マイ作品</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="works-list.css">
</head>
<body>

<div class="layout">
  <div id="slot-sidenav"></div>


  <div class="app">

    <header class="topbar hub-topbar">
      <p class="wordmark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8.6A6 6 0 1 1 7.4 2 4.8 4.8 0 0 0 14 8.6Z" stroke="#e07b2e" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        kakko.
      </p>
      <a class="breadcrumb" href="works.html">← 作品</a>
      <p class="page-title">マイ作品</p>
      <p class="page-subtitle">投稿した作品を管理できます</p>
    </header>

    <div class="works-quicknav">
      <a class="quicknav-btn quicknav-btn-primary" href="works-upload.html">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        作品投稿
      </a>
      <a class="quicknav-btn current" href="works-list.html">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="8" y="1.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="8" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="8" y="8" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
        マイ作品
      </a>
    </div>

    <main class="feed">
      <a class="action-card" href="works-upload.html" style="margin-bottom: 22px;">
        <span class="action-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 13V4M6.5 7.5 10 4l3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 14v1.5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </span>
        <span class="action-text">
          <strong>新しい作品を投稿する</strong>
          <small>文字・画像・動画の作品をアップロードできます</small>
        </span>
        <span class="action-arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4.5 4.5L5 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>

      <button type="button" class="action-card" id="open-series-modal" style="width: 100%; border: 1px solid var(--ink-line); cursor: pointer; margin-bottom: 22px;">
        <span class="action-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="3.5" width="10" height="8" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 6.5h7a1.2 1.2 0 0 1 1.2 1.2v6a1.2 1.2 0 0 1-1.2 1.2h-7A1.2 1.2 0 0 1 4.3 13.7v-6A1.2 1.2 0 0 1 5.5 6.5Z" stroke="currentColor" stroke-width="1.3"/></svg>
        </span>
        <span class="action-text">
          <strong>新しいシリーズを作成する</strong>
          <small>連なる作品をまとめて、話数ごとに公開できます</small>
        </span>
        <span class="action-arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4.5 4.5L5 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>

      <p class="section-heading community-card-title" style="margin: 26px 0 4px;">シリーズ</p>
      <section class="community-list" id="series-list"></section>

      <p class="section-heading community-card-title" style="margin: 26px 0 4px;">作品</p>
      <section class="community-list" id="works-list"></section>
    </main>

  </div>

</div>

<div id="slot-toast"></div>
<div id="slot-series-modal"></div>


<script src="components-bundle.js"></script>
<script src="loader.js"></script>
<script src="community-common.js"></script>
<script src="series-store.js"></script>
<script src="series-modal.js"></script>
<script src="works-list.js"></script>
<script>
  Promise.all([
    KakkoLoader.load('component-sidenav.frag', '#slot-sidenav').then(function () { KakkoLoader.markActiveNav('works'); }),
    KakkoLoader.load('component-toast.frag', '#slot-toast'),
    KakkoLoader.load('component-series-modal.frag', '#slot-series-modal')
  ]).then(initWorksList);
</script>
</body>
</html>
