<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kakko. ｜ コミュニティ参加</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="community-join.css">
</head>
<body>

<div class="layout">
  <div id="slot-sidenav"></div>


  <div class="app">
    <header class="topbar hub-topbar">
      <p class="wordmark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8.6A6 6 0 1 1 7.4 2 4.8 4.8 0 0 0 14 8.6Z" stroke="#e07b2e" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        kakko.
      </p>
      <a class="breadcrumb" href="community.html">← コミュニティ</a>
      <p class="page-title">コミュニティ参加</p>
      <p class="page-subtitle">気になるコミュニティを見つけて参加しよう</p>
      <div class="search-box">
        <svg class="search-box-icon" width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.2" stroke="currentColor" stroke-width="1.4"/><path d="m12 12 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" id="q" class="search-box-input" placeholder="作品名・コミュニティ名・ユーザー名で検索" autocomplete="off">
        <button class="search-clear" id="q-clear" type="button" aria-label="検索をクリア" hidden><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="m2 2 6 6M8 2 2 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      </div>
      <nav class="tabs" role="tablist" aria-label="検索結果の絞り込み">
        <button class="tab active" role="tab" aria-selected="true" data-mode="latest">最新</button>
        <button class="tab" role="tab" aria-selected="false" data-mode="oldest">古い順</button>
        </nav>
      <div class="tab-track"><span class="tab-indicator"></span></div>
    </header>

    <main class="feed">
      <p class="result-count" id="result-count"></p>
      <section id="results"></section>
      <div class="empty-result" id="empty" hidden>条件に合う結果がありません。<br>別のキーワードで検索してみましょう</div>
    </main>
  </div>

</div>

<div id="slot-toast"></div>


<script src="components-bundle.js"></script>
<script src="loader.js"></script>
<script src="community-common.js"></script>
<script src="community-join.js"></script>
<script>
  initCommunityJoin();
  KakkoLoader.load('component-sidenav.frag', '#slot-sidenav').then(function () { KakkoLoader.markActiveNav('community'); });
  KakkoLoader.load('component-toast.frag', '#slot-toast');
</script>
</body>
</html>
