<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kakko. ｜ 設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>

<div class="layout">
  <div id="slot-sidenav"></div>


  <div class="app">

    <header class="topbar">
      <p class="wordmark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8.6A6 6 0 1 1 7.4 2 4.8 4.8 0 0 0 14 8.6Z" stroke="#e07b2e" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        kakko.
      </p>
      <p class="page-title">設定</p>
    </header>

    <main class="settings-main">

      <section class="settings-section">
        <div class="settings-section-head">
          <p class="settings-section-title">ミュートワード</p>
          <p class="settings-section-desc">登録した単語を含む投稿をタイムラインやコミュニティで目立たなくします。ここでの変更はタイムライン・コミュニティ詳細画面にもすぐに反映されます。</p>
        </div>
        <div class="settings-section-body">
          <div class="mute-add-row">
            <input type="text" class="mute-input" id="mute-input" placeholder="ミュートしたい単語を入力" maxlength="40">
            <button type="button" class="mute-add-btn" id="mute-add-btn">追加</button>
          </div>
          <p class="mute-empty" id="mute-empty" hidden>登録されているミュートワードはありません</p>
          <div class="mute-list" id="mute-list"></div>
        </div>
      </section>

      <section class="settings-section">
        <div class="settings-section-head">
          <p class="settings-section-title">ユーザー設定</p>
          <p class="settings-section-desc">アカウントに関する設定です。</p>
        </div>
        <div class="settings-section-body">
          <div class="settings-list">
            <button type="button" class="settings-row" id="open-password-modal">
              <span class="settings-row-icon">
                <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><rect x="3.5" y="7.5" width="10" height="7" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M5.8 7.5V5.3a2.7 2.7 0 0 1 5.4 0v2.2" stroke="currentColor" stroke-width="1.3"/></svg>
              </span>
              <span class="settings-row-body">
                <p class="settings-row-title">パスワードを設定する</p>
                <p class="settings-row-sub">ログイン用のパスワードを変更します</p>
              </span>
              <span class="settings-row-arrow">
                <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1.5 1.5 6.5 7l-5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
            </button>
            <button type="button" class="settings-row danger" id="logout-btn">
              <span class="settings-row-icon">
                <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M7 3H4a1.4 1.4 0 0 0-1.4 1.4v7.2A1.4 1.4 0 0 0 4 13h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.5 11.5 14 8l-3.5-3.5M14 8H6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span class="settings-row-body">
                <p class="settings-row-title">ログアウト</p>
                <p class="settings-row-sub">このアカウントからログアウトします</p>
              </span>
              <span class="settings-row-arrow">
                <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1.5 1.5 6.5 7l-5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
            </button>
          </div>
        </div>
      </section>

    </main>

  </div>

</div>

<div class="modal-overlay" id="password-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <p class="modal-title">パスワードを設定する</p>
      <button type="button" class="modal-close" id="close-password-modal">✕</button>
    </div>
    <div class="modal-field">
      <label class="modal-label" for="pw-current">現在のパスワード</label>
      <input type="password" class="modal-input" id="pw-current" placeholder="••••••••">
    </div>
    <div class="modal-field">
      <label class="modal-label" for="pw-new">新しいパスワード</label>
      <input type="password" class="modal-input" id="pw-new" placeholder="••••••••">
    </div>
    <div class="modal-field">
      <label class="modal-label" for="pw-confirm">新しいパスワード(確認)</label>
      <input type="password" class="modal-input" id="pw-confirm" placeholder="••••••••">
    </div>
    <button type="button" class="modal-submit" id="pw-submit">パスワードを更新する</button>
  </div>
</div>

<div id="slot-toast"></div>


<script src="components-bundle.js"></script>
<script src="loader.js"></script>
<script src="community-common.js"></script>
<script src="settings.js"></script>
<script>
  initSettings();
  KakkoLoader.load('component-sidenav.frag', '#slot-sidenav').then(function () { KakkoLoader.markActiveNav('settings'); });
  KakkoLoader.load('component-toast.frag', '#slot-toast');
</script>
</body>
</html>
