<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kakko. ｜ シリーズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="series-view.css">
</head>
<body>

<div class="layout">
  <div id="slot-sidenav"></div>


  <div class="app">

    <header class="topbar hub-topbar">
      <p class="wordmark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8.6A6 6 0 1 1 7.4 2 4.8 4.8 0 0 0 14 8.6Z" stroke="#e07b2e" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        kakko.
      </p>
      <a class="breadcrumb" href="works-list.html">← マイ作品</a>
      <p class="page-title">シリーズ</p>
      <p class="page-subtitle">連なる話数をまとめて確認できます</p>
    </header>

    <div class="works-quicknav">
      <a class="quicknav-btn quicknav-btn-primary" href="works-upload.html">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        作品投稿
      </a>
      <a class="quicknav-btn" href="works-list.html">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="8" y="1.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="8" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="8" y="8" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
        マイ作品
      </a>
    </div>

    <main class="feed">
      <section class="community-header" id="sv-header" hidden>
        <span class="work-icon community-header-icon" style="background: linear-gradient(135deg, #7089b3, #2e4468 65%, var(--ink-soft));">
          <svg width="26" height="26" viewBox="0 0 20 20" fill="none"><path d="M2.5 14c1-4 2.5-8 6.5-9.5C9 7 10.5 8.5 13 9c-1.5 2-4 2.5-6 2-1.5 1-3 2-4.5 3Z" stroke="#f4ead9" stroke-width="1.1" stroke-linejoin="round"/><path d="M13 9c1.5-.5 3-1.5 4.5-3.5" stroke="#f4ead9" stroke-width="1.1" stroke-linecap="round"/></svg>
        </span>
        <p class="community-header-title" id="sv-title"></p>
        <p class="community-header-meta" id="sv-meta"></p>
        <p class="community-header-desc" id="sv-desc"></p>
        <div class="series-actions">
          <button type="button" class="quicknav-btn" id="sv-edit">
            <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M9.8 2.3 12.7 5.2 5 12.9 2 13l.1-3L9.8 2.3Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            シリーズを更新
          </button>
          <button type="button" class="quicknav-btn quicknav-btn-primary" id="sv-manage">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10M2 7h10M2 10.5h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            シリーズ内作品管理
          </button>
        </div>
      </section>

      <div class="empty-state" id="sv-notfound" hidden>
        <p>このシリーズは見つかりませんでした。</p>
        <a class="result-work-link" href="works-list.html">マイ作品へ戻る</a>
      </div>

      <h2 class="result-heading section-heading" id="sv-list-heading" hidden>話数一覧</h2>
      <section class="community-list" id="sv-list"></section>
    </main>

  </div>

</div>

<div id="slot-toast"></div>
<div id="slot-series-modal"></div>
<div id="slot-series-works-modal"></div>


<script src="components-bundle.js"></script>
<script src="loader.js"></script>
<script src="community-common.js"></script>
<script src="series-store.js"></script>
<script src="series-modal.js"></script>
<script src="series-works-modal.js"></script>
<script src="series-view.js"></script>
<script>
  Promise.all([
    KakkoLoader.load('component-sidenav.frag', '#slot-sidenav').then(function () { KakkoLoader.markActiveNav('works'); }),
    KakkoLoader.load('component-toast.frag', '#slot-toast'),
    KakkoLoader.load('component-series-modal.frag', '#slot-series-modal'),
    KakkoLoader.load('component-series-works-modal.frag', '#slot-series-works-modal')
  ]).then(initSeriesView);
</script>
</body>
</html>
