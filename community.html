<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kakko. ｜ コミュニティ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="community.css">
</head>
<body>

<div class="layout">

  <div id="slot-sidenav"></div>

  <div class="app">

    <header class="topbar hub-topbar">
      <p class="wordmark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8.6A6 6 0 1 1 7.4 2 4.8 4.8 0 0 0 14 8.6Z" stroke="#e07b2e" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        kakko.
      </p>
      <p class="page-title">コミュニティ</p>
      <p class="page-subtitle">好きな作品ごとにコミュニティをつくって、感想を語り合おう</p>
    </header>

    <main class="feed">

      <section class="action-row">
        <a class="action-card" href="community-list.html">
          <span class="action-icon">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="3.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="11.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="11.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.3"/></svg>
          </span>
          <span class="action-text">
            <strong>参加コミュニティ一覧</strong>
            <small>参加中のコミュニティとタイムラインを見る</small>
          </span>
          <span class="action-arrow" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4.5 4.5L5 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>
        <a class="action-card" href="community-join.html">
          <span class="action-icon">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="8.2" cy="8" r="4.6" stroke="currentColor" stroke-width="1.3"/><path d="M14.5 14.5 17.5 17.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8.2 6v4M6.2 8h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </span>
          <span class="action-text">
            <strong>コミュニティ参加</strong>
            <small>新しいコミュニティを探して参加する</small>
          </span>
          <span class="action-arrow" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4.5 4.5L5 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>
        <a class="action-card" href="community-create.html">
          <span class="action-icon">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="currentColor" stroke-width="1.3"/><path d="M10 6.8v6.4M6.8 10h6.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </span>
          <span class="action-text">
            <strong>コミュニティ作成</strong>
            <small>好きな作品のコミュニティをつくる</small>
          </span>
          <span class="action-arrow" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4.5 4.5L5 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>
      </section>

      <h2 class="result-heading section-heading">話題のコミュニティ</h2>
      <section class="community-list" id="trending"></section>

      <h2 class="result-heading section-heading">おすすめコミュニティ</h2>
      <section class="community-list" id="recommend"></section>

    </main>

  </div>

</div>


<div id="slot-toast"></div>

<script src="components-bundle.js"></script>
<script src="loader.js"></script>
<script src="community-common.js"></script>
<script src="community.js"></script>
<script>
  initCommunityHub();
  KakkoLoader.load('component-sidenav.frag', '#slot-sidenav').then(function () { KakkoLoader.markActiveNav('community'); });
  KakkoLoader.load('component-toast.frag', '#slot-toast');
</script>

</body>
</html>
