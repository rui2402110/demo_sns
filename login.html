<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="auth.css">
<title>kakko. ｜ ログイン</title>
</head>
<body>
<main class="auth-page">
  <section class="auth-card">
    <a class="auth-back" href="auth.html">← 戻る</a>
    <p class="wordmark"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M14 8.6A6 6 0 1 1 7.4 2 4.8 4.8 0 0 0 14 8.6Z" stroke="#e07b2e" stroke-width="1.3" stroke-linejoin="round"/></svg> kakko.</p>
    <p class="auth-title">ログイン</p>
    <p class="auth-sub">ユーザー名とパスワードを入力してください</p>

    <form class="auth-form" id="auth-form" data-mode="login" novalidate>
      <div class="form-field">
        <label class="form-label" for="auth-username">ユーザー名</label>
        <input type="text" id="auth-username" class="form-input" autocomplete="username" autocapitalize="none" spellcheck="false">
        <p class="auth-field-error" id="auth-username-error" role="alert"></p>
      </div>
      <div class="form-field">
        <label class="form-label" for="auth-password">パスワード</label>
        <input type="password" id="auth-password" class="form-input" autocomplete="current-password">
        <p class="auth-field-error" id="auth-password-error" role="alert"></p>
      </div>
      <button type="submit" class="auth-btn auth-btn-primary">ログインする</button>
      <p class="auth-status" id="auth-status" role="status"></p>
    </form>

    <p class="auth-switch">アカウントをお持ちでない方は <a href="register.html">新規登録</a></p>
    <p class="auth-demo-note">デモ画面です。入力内容は保存・送信されません。</p>
  </section>
</main>
<script src="auth-form.js"></script>
<script>initAuthForm();</script>
</body>
</html>
